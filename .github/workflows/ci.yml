name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd api && uv sync --all-extras
      - run: cd api && uv run ruff check medora tests ../worker ../scripts ../eval ../safety_harness
      - run: cd api && uv run mypy medora ../worker/worker.py
      - run: cd api && uv run pytest -q
      - name: Safety harness (any miss fails the build)
        run: uv run --project api python safety_harness/run.py
      - name: Gold sets (bars + baseline tolerance)
        run: uv run --project api python eval/run_eval.py
      - name: LLM evals (replay recordings; skipped with a notice when none)
        run: MEDORA_LLM_MODE=replay uv run --project api python eval/run_llm_eval.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd web && npm ci && npm run lint && npx tsc --noEmit && npm run build
