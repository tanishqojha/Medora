[project]
name = "medora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "polars>=1.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "pyjwt>=2.8",
  "jellyfish>=1.0",
  "indic-transliteration>=2.3",
  "pypdf>=4.2",
]

[project.optional-dependencies]
messy = ["pypdfium2>=4.30", "rapidocr-onnxruntime>=1.3", "pillow>=10.3"]
pii = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
graph = ["langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx>=0.27",
    "pgserver>=0.1.4",
    "playwright>=1.64.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medora"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.File", "fastapi.Form", "fastapi.Query",
                          "medora.auth.require"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs DATABASE_URL"]

[tool.hatch.metadata]
allow-direct-references = true
