<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priority Card Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
:root{color-scheme:light;--paper:#ececec;--ink:#111;--ink2:#444}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arimo,Helvetica,Arial,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:20px 16px 32px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;--sans:Arimo,Helvetica,Arial,sans-serif;background:#fff}
.bar{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
button{font:inherit;text-transform:uppercase;letter-spacing:.06em;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:8px;min-height:40px;min-width:88px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{flex:1;accent-color:#111}
.t{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
</style>
<style>#stage { --ground:#ffffff; --main:#111111; --second:#111112; --accent:#767676; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.dw-cam { position:absolute; left:0; top:0; width:1900px; height:1060px; transform-origin:0 0 }
.dw-svg { position:absolute; left:0; top:0; overflow:visible; --u:1 }
.dw-svg text { font-family:var(--sans, system-ui, sans-serif); text-transform:uppercase }
.dw-svg .border { fill:none; stroke:var(--main); stroke-width:1.2 }
.dw-svg .obj { fill:var(--ground); stroke:var(--main); stroke-width:calc(1.6px * var(--u)); stroke-linejoin:round }
.dw-svg .well { fill:color-mix(in srgb, var(--second) 5%, var(--ground)); stroke:var(--main); stroke-width:calc(1px * var(--u)) }
.dw-svg .hug { fill:color-mix(in srgb, var(--second) 10%, var(--ground)); stroke:var(--main); stroke-width:calc(1px * var(--u)) }
.dw-svg .slot { fill:none; stroke:color-mix(in srgb, var(--second) 75%, var(--ground)); stroke-width:calc(.8px * var(--u)); stroke-dasharray:calc(4px * var(--u)) calc(3px * var(--u)) }
.dw-svg .thin { fill:none; stroke:var(--main); stroke-width:calc(.8px * var(--u)) }
.dw-svg .ph { fill:none; stroke:var(--accent); stroke-width:calc(.8px * var(--u)); stroke-dasharray:calc(14px * var(--u)) calc(3px * var(--u)) calc(3px * var(--u)) calc(3px * var(--u)) }
.dw-svg .cl { fill:none; stroke:var(--accent); stroke-width:.7; stroke-dasharray:16 3 2 3 }
.dw-svg .dl, .dw-svg .lead { stroke:var(--main); stroke-width:.7; fill:none }
.dw-svg .ext { stroke:var(--main); stroke-width:.55; fill:none }
.dw-svg .arrow, .dw-svg .dot { fill:var(--main) }
.dw-svg .hl { stroke:color-mix(in srgb, var(--second) 70%, var(--ground)); stroke-width:.7 }
.dw-svg .hs { stroke:var(--main); stroke-width:calc(.8px * var(--u)) }
.dw-svg .env { fill:none; stroke:var(--main); stroke-width:.8; stroke-dasharray:10 3 2 3 }
.dw-svg .nb { fill:var(--ground); stroke:var(--main); stroke-width:.9 }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame"><div id="stage"></div></div>
  <div class="bar">
    <button id="play" type="button" aria-label="Pause">Pause</button>
    <input id="scrub" type="range" min="0" max="11.5" step="0.01" value="0" aria-label="Film position">
    <span class="t" id="time">0.00 / 11.50 s</span>
  </div>
</div>
<script>
var SCENES = {};
var stage = document.getElementById('stage');
var kit = (function () {
  const clamp01 = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp01((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x * x, eio = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  return { seg, lerp, eo, ei, eio, clamp01, stage, width: 1920, height: 1080,
    h: s => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstElementChild; },
    css: s => { const st = document.createElement('style'); st.textContent = s; stage.appendChild(st); },
    scene: (id, o) => { SCENES[id] = o; } };
})();
</script>
<script>const { seg, lerp, eo, eio, clamp01 } = kit;
const DW_NS = 'http://www.w3.org/2000/svg';
/* Camera: close on the chips/title corner -> plan -> exploded view -> whole sheet. Scene seconds (scaled by 0.85). */
const DW_CAM = [
  { t: 0, cx: 662, cy: 374, z: 4.2 }, { t: 2.3, cx: 670, cy: 376, z: 4.0 },
  { t: 4.2, cx: 940, cy: 430, z: 1.55 }, { t: 5.3, cx: 942, cy: 432, z: 1.52 },
  { t: 7.2, cx: 390, cy: 770, z: 1.55 }, { t: 7.8, cx: 392, cy: 772, z: 1.52 },

kit.scene('drawing', {
  init(kit) {
    kit.css('.dw-svg .dt{font-size:11px;fill:var(--main);paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}' +

      '.dw-svg .sl{font-size:9px;fill:color-mix(in srgb,var(--second) 75%,var(--ground));letter-spacing:.08em}' +

      '.dw-svg .vt{font-size:12px;fill:var(--main);letter-spacing:.1em}.dw-svg .nbt{font-size:9.5px;fill:var(--main)}' +
      '.dw-svg .th{font-size:10.5px;fill:var(--main);letter-spacing:.05em}.dw-svg .tc{font-size:10.5px;fill:var(--main);text-transform:none}');

    const camEl = root.querySelector('.dw-cam');

    const svg = document.createElementNS(DW_NS, 'svg');

      return e; }
    function tx(x, y, s, c, a, p) { const t = mk('text', Object.assign({ x: x, y: y, class: c || 'dt' }, a || {}), p); t.textContent = s; return t; }
    noreg = 1; const d = mk('defs', {}); const m = mk('marker', { id: 'dwar', viewBox: '0 0 10 10', refX: 10, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' }, d);
    mk('path', { d: 'M0,1.7 L10,5 L0,8.3 z', class: 'arrow' }, m);
    const pt = mk('pattern', { id: 'dwhat', width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, d); mk('line', { x1: 0, y1: 0, x2: 0, y2: 5, class: 'hl' }, pt); noreg = 0;
    const A = 'url(#dwar)', HAT = 'url(#dwhat)';
    function dimH(x1, x2, y, e1, e2, l, o) { o = o || {}; [[x1, e1], [x2, e2]].forEach(([x, e]) => { if (e == null) return; const s = Math.sign(y - e) || 1; mk('line', { x1: x, y1: e + s * 3, x2: x, y2: y + s * 5, class: 'ext' }); });
      if (x2 - x1 >= 28) mk('line', { x1: x1, y1: y, x2: x2, y2: y, class: 'dl', 'marker-start': A, 'marker-end': A }); else { mk('line', { x1: x1 - 13, y1: y, x2: x1, y2: y, class: 'dl', 'marker-end': A }); mk('line', { x1: x2 + 13, y1: y, x2: x2, y2: y, class: 'dl', 'marker-end': A }); }

    function callout(px, py, ex, ey, l, dir, c) { const s = dir || (ex >= px ? 1 : -1); mk('circle', { cx: px, cy: py, r: 1.8, class: 'dot' }); mk('polyline', { points: px + ',' + py + ' ' + ex + ',' + ey + ' ' + (ex + s * 10) + ',' + ey, class: 'lead' }); tx(ex + s * 14, ey + 4, l, c || 'dt', { 'text-anchor': s > 0 ? 'start' : 'end' }); }

    function nb(x, y, n) { mk('rect', { x: x - 6, y: y - 6, width: 12, height: 12, class: 'nb' }); tx(x, y + 3.5, String(n), 'nbt', { 'text-anchor': 'middle' }); }
    function rr(x, y, w, h, r, c, p) { return mk('rect', { x: x, y: y, width: w, height: h, rx: r, class: c }, p); }
    function slotLabel(x, y, w, h, l, al, p) { tx(al === 'l' ? x + 6 : x + w / 2, y + h / 2 + 3.2, l, 'sl', { 'text-anchor': al === 'l' ? 'start' : 'middle' }, p); }
    function title(x, y, t, s) { tx(x, y, t, 'vt', { 'text-anchor': 'middle' }); if (s) tx(x, y + 14, s, 'dts', { 'text-anchor': 'middle' }); }
    function xbox(x, y, w, h, p) { mk('rect', { x: x, y: y, width: w, height: h, class: 'thin' }, p); mk('path', { d: 'M' + x + ',' + y + ' l' + w + ',' + h + ' M' + (x + w) + ',' + y + ' l' + (-w) + ',' + h, class: 'thin' }, p); }
    function detailRef(cx, cy, r, lbl, lx, ly) { mk('circle', { cx: cx, cy: cy, r: r, class: 'ph' }); const a = Math.atan2(ly - cy, lx - cx); mk('line', { x1: cx + r * Math.cos(a), y1: cy + r * Math.sin(a), x2: lx, y2: ly, class: 'lead' }); tx(lx + (lx < cx ? -4 : 4), ly + 4, lbl, 'dts', { 'text-anchor': lx < cx ? 'end' : 'start' }); }
    function table(x, y, ttl, rows) { const ws = [40, 88, 96], rh = 17; tx(x, y - 8, ttl, 'vt'); [['Code', 'Variable', 'Value']].concat(rows).forEach((r, i) => { let c2 = x; r.forEach((c, j) => { mk('rect', { x: c2, y: y + i * rh, width: ws[j], height: rh, class: 'thin' }); tx(c2 + (j ? ws[j] / 2 : 6), y + i * rh + 12, c, i ? 'tc' : 'th', { 'text-anchor': j ? 'middle' : 'start' }); c2 += ws[j]; }); }); return y + (rows.length + 1) * rh + 34; }
    function notes(list) { tx(50, 58, 'Notes:', 'nth'); tx(112, 58, '(unless otherwise specified)', 'nt'); list.forEach(([n, t], i) => { const y = 88 + i * 24; if (n) { nb(56, y - 4, n); tx(72, y, t, 'nt'); } else tx(50, y, t, 'nt'); }); }

    /* Measured geometry (CSS px): card 1128 × 222 at a 1440 px viewport. Same as the static sheet. */
    const W = 1128, H = 222, CH = [[24, 81], [109, 90], [203, 300]], LN = [[110, 24, 708], [138, 18, 708], [160, 22, 260]];
    const k = .6, PX = 600, PY = 340, X = v => PX + v * k, Y = v => PY + v * k;

    /* ---------- plan: outline from the top-left, then chips, title, well, actions ---------- */
    at(-0.95, 0, 2.4); { const x0 = X(0), y0 = Y(0), w = W * k, h = H * k, q = 16 * k; mk('path', { d: 'M' + x0 + ',' + (y0 + h * .55) + ' V' + (y0 + q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + q) + ',' + y0 + ' H' + (x0 + w - q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + w) + ',' + (y0 + q) + ' V' + (y0 + h - q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + w - q) + ',' + (y0 + h) + ' H' + (x0 + q) + ' A' + q + ',' + q + ' 0 0 1 ' + x0 + ',' + (y0 + h - q) + ' Z', class: 'obj' }); }
    at(-0.5, .18, .6); CH.forEach(([x, w]) => r(x, 24, w, 18, 9, 'hug'));
    at(0.35, 0, .5); tx(X(203) + 90, Y(24) + 8.6, 'Chip · hug', 'sl', { 'text-anchor': 'middle' });
    at(0.6, 0, .6); r(24, 50, 768, 36, 2, 'slot', 'Title slot · flex · wraps', 'l');
    at(1.2, .08, .45); dimH(X(0), X(24), Y(-24), Y(0), Y(24), 'S1', { dx: -8 }); dimV(Y(24), Y(42), X(-34), X(0), X(0), 'H1', { side: 'l', dy: -3 }); dimV(Y(42), Y(50), X(-34), X(0), X(0), 'S4', { side: 'l', dy: -9 }); dimV(Y(50), Y(86), X(-34), X(0), X(0), 'H2', { side: 'l', dy: 4 });
    at(2.4, .12, .7); r(24, 94, 768, 104, 8, 'well'); xbox(X(40), Y(110), 20 * k, 20 * k);
    at(2.7, .08, .5); LN.forEach(([y, h, w], i) => r(68, y, w, h, 2, 'slot', ['Reason slot · fill', 'Meta slot · fill', 'Source slot · hug'][i], 'l'));
    at(3.0, .1, .55); r(816, 24, 288, 42, 8, 'obj', 'Primary action · fill'); r(816, 74, 288, 42, 8, 'hug', 'Secondary action · fill');
    at(3.3, .1, .6); mk('line', { x1: X(-14), y1: Y(68), x2: X(W + 14), y2: Y(68), class: 'cl' }); mk('line', { x1: X(960), y1: Y(-14), x2: X(960), y2: Y(H + 14), class: 'cl' });
    at(3.45, .05, .4); dimH(X(24), X(792), Y(-24), null, Y(24), 'FLEX', { c: 'dts' }); dimH(X(792), X(816), Y(-24), null, Y(24), 'S2'); dimH(X(816), X(1104), Y(-24), null, Y(24), 'W2'); dimH(X(1104), X(W), Y(-24), null, Y(0), 'S1', { dx: 8 });
    at(3.7, .03, .4); dimH(X(0), X(W), Y(-50), Y(-28), Y(-28), 'W'); tx(X(W / 2) + 70, Y(-50) - 4, '= 712 – 1384 · ref 1128 (fill)', 'dts');
    at(3.85, .04, .4); dimV(Y(0), Y(24), X(-34), X(0), X(0), 'S1', { side: 'l' }); dimV(Y(86), Y(94), X(-34), X(0), X(0), 'S5', { side: 'l', dy: 9 }); dimV(Y(94), Y(198), X(-34), X(0), X(0), 'H5', { side: 'l' }); dimV(Y(198), Y(H), X(-34), X(0), X(0), 'S1', { side: 'l' }); dimV(Y(0), Y(H), X(-96), X(-40), X(-40), '(REF 222)');
    at(4.0, .05, .4); [[24, 66, 'H3'], [66, 74, 'S8'], [74, 116, 'H3']].forEach(([a, b, l]) => dimV(Y(a), Y(b), X(W + 34), X(1104), X(1104), l, { side: 'r' }));

    at(4.8, .1, .5); title(X(W / 2), Y(H) + 62, 'Plan view', 'Scale 0.6:1 · reference W = 1128');
