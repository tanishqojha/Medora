<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Item Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
:root{color-scheme:light;--paper:#ececec;--ink:#111;--ink2:#444}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arimo,Helvetica,Arial,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:20px 16px 32px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;--sans:Arimo,Helvetica,Arial,sans-serif;background:#fff}
.bar{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
button{font:inherit;text-transform:uppercase;letter-spacing:.06em;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:8px;min-height:40px;min-width:88px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{flex:1;accent-color:#111}
.t{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
</style>
<style>#stage { --ground:#ffffff; --main:#111111; --second:#111112; --accent:#767676; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.dw-cam { position:absolute; left:0; top:0; width:1900px; height:1060px; transform-origin:0 0 }
.dw-svg { position:absolute; left:0; top:0; overflow:visible; --u:1 }
.dw-svg text { font-family:var(--sans, system-ui, sans-serif); text-transform:uppercase }
.dw-svg .border { fill:none; stroke:var(--main); stroke-width:1.2 }
.dw-svg .obj { fill:var(--ground); stroke:var(--main); stroke-width:calc(1.6px * var(--u)); stroke-linejoin:round }
.dw-svg .well { fill:color-mix(in srgb, var(--second) 5%, var(--ground)); stroke:var(--main); stroke-width:calc(1px * var(--u)) }
.dw-svg .hug { fill:color-mix(in srgb, var(--second) 10%, var(--ground)); stroke:var(--main); stroke-width:calc(1px * var(--u)) }
.dw-svg .slot { fill:none; stroke:color-mix(in srgb, var(--second) 75%, var(--ground)); stroke-width:calc(.8px * var(--u)); stroke-dasharray:calc(4px * var(--u)) calc(3px * var(--u)) }
.dw-svg .thin { fill:none; stroke:var(--main); stroke-width:calc(.8px * var(--u)) }
.dw-svg .ph { fill:none; stroke:var(--accent); stroke-width:calc(.8px * var(--u)); stroke-dasharray:calc(14px * var(--u)) calc(3px * var(--u)) calc(3px * var(--u)) calc(3px * var(--u)) }
.dw-svg .cl { fill:none; stroke:var(--accent); stroke-width:.7; stroke-dasharray:16 3 2 3 }
.dw-svg .dl, .dw-svg .lead { stroke:var(--main); stroke-width:.7; fill:none }
.dw-svg .ext { stroke:var(--main); stroke-width:.55; fill:none }
.dw-svg .arrow, .dw-svg .dot { fill:var(--main) }
.dw-svg .hl { stroke:color-mix(in srgb, var(--second) 70%, var(--ground)); stroke-width:.7 }
.dw-svg .hs { stroke:var(--main); stroke-width:calc(.8px * var(--u)) }
.dw-svg .env { fill:none; stroke:var(--main); stroke-width:.8; stroke-dasharray:10 3 2 3 }
.dw-svg .nb { fill:var(--ground); stroke:var(--main); stroke-width:.9 }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame"><div id="stage"></div></div>
  <div class="bar">
    <button id="play" type="button" aria-label="Pause">Pause</button>
    <input id="scrub" type="range" min="0" max="11.5" step="0.01" value="0" aria-label="Film position">
    <span class="t" id="time">0.00 / 11.50 s</span>
  </div>
</div>
<script>
var SCENES = {};
var stage = document.getElementById('stage');
var kit = (function () {
  const clamp01 = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp01((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x * x, eio = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  return { seg, lerp, eo, ei, eio, clamp01, stage, width: 1920, height: 1080,
    h: s => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstElementChild; },
    css: s => { const st = document.createElement('style'); st.textContent = s; stage.appendChild(st); },
    scene: (id, o) => { SCENES[id] = o; } };
})();
</script>
<script>const { seg, lerp, eo, eio, clamp01 } = kit;
const DW_NS = 'http://www.w3.org/2000/svg';
/* Camera: close on the chips/title corner -> plan -> exploded view -> whole sheet. Scene seconds (scaled by 0.85). */
const DW_CAM = [{"t": 0, "cx": 520, "cy": 330, "z": 3.4}, {"t": 2.2, "cx": 530, "cy": 335, "z": 3.2}, {"t": 4.0, "cx": 700, "cy": 470, "z": 1.55}, {"t": 5.4, "cx": 704, "cy": 472, "z": 1.52}, {"t": 7.2, "cx": 1180, "cy": 450, "z": 1.5}, {"t": 8.0, "cx": 1184, "cy": 452, "z": 1.48}, {"t": 9.4, "cx": 930, "cy": 530, "z": 1.0}, {"t": 13, "cx": 930, "cy": 530, "z": 0.99}];
kit.scene('drawing', {
  init(kit) {
    kit.css('.dw-svg .dt{font-size:11px;fill:var(--main);paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}' +
      '.dw-svg .dts{font-size:9.5px;fill:color-mix(in srgb,var(--second) 75%,var(--ground));letter-spacing:.06em;paint-order:stroke;stroke:var(--ground);stroke-width:3px}' +
      '.dw-svg .sl{font-size:9px;fill:color-mix(in srgb,var(--second) 75%,var(--ground));letter-spacing:.08em}' +
      '.dw-svg .nt{font-size:11.5px;fill:var(--main);letter-spacing:.06em}.dw-svg .nth{font-size:13px;font-weight:700;fill:var(--main);letter-spacing:.06em}' +
      '.dw-svg .vt{font-size:12px;fill:var(--main);letter-spacing:.1em}.dw-svg .nbt{font-size:9.5px;fill:var(--main)}' +
      '.dw-svg .th{font-size:10.5px;fill:var(--main);letter-spacing:.05em}.dw-svg .tc{font-size:10.5px;fill:var(--main);text-transform:none}');
    const root = kit.h('<div class="ground"><div class="dw-cam"></div></div>');
    kit.stage.append(root);
    const camEl = root.querySelector('.dw-cam');
    this.cam = camEl.style;
    const svg = document.createElementNS(DW_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1900 1060'); svg.setAttribute('width', '1900'); svg.setAttribute('height', '1060'); svg.setAttribute('class', 'dw-svg');
    camEl.appendChild(svg);
    const REG = this.reg = []; let sv = svg, CUR = { a: 0, s: 0, d: .6, i: 0 }, noreg = 0;
    const at = (a, s, d) => { CUR = { a: a, s: s || 0, d: d || .6, i: 0 }; };
    const kind = (e, t) => { if (t === 'text') return 'f'; const c = ' ' + (e.getAttribute('class') || '') + ' ';
      if (/ (slot|ph|cl|env|hs) /.test(c) || (e.getAttribute('fill') || '').indexOf('url') === 0) return 'f'; return 'd'; };
    function mk(t, a, p) { const e = document.createElementNS(DW_NS, t); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); (p || sv).appendChild(e);
      if (!noreg && t !== 'g') { const s = CUR.a + CUR.i * CUR.s; CUR.i++; const k = kind(e, t); if (k === 'd') e.setAttribute('pathLength', '1'); e.style.opacity = 0; REG.push({ e: e, a: s, b: s + CUR.d, k: k, last: -1 }); }
      return e; }
    function tx(x, y, s, c, a, p) { const t = mk('text', Object.assign({ x: x, y: y, class: c || 'dt' }, a || {}), p); t.textContent = s; return t; }
    noreg = 1; const d = mk('defs', {}); const m = mk('marker', { id: 'dwar', viewBox: '0 0 10 10', refX: 10, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' }, d);
    mk('path', { d: 'M0,1.7 L10,5 L0,8.3 z', class: 'arrow' }, m);
    const pt = mk('pattern', { id: 'dwhat', width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, d); mk('line', { x1: 0, y1: 0, x2: 0, y2: 5, class: 'hl' }, pt); noreg = 0;
    const A = 'url(#dwar)', HAT = 'url(#dwhat)';
    function dimH(x1, x2, y, e1, e2, l, o) { o = o || {}; [[x1, e1], [x2, e2]].forEach(([x, e]) => { if (e == null) return; const s = Math.sign(y - e) || 1; mk('line', { x1: x, y1: e + s * 3, x2: x, y2: y + s * 5, class: 'ext' }); });
      if (x2 - x1 >= 28) mk('line', { x1: x1, y1: y, x2: x2, y2: y, class: 'dl', 'marker-start': A, 'marker-end': A }); else { mk('line', { x1: x1 - 13, y1: y, x2: x1, y2: y, class: 'dl', 'marker-end': A }); mk('line', { x1: x2 + 13, y1: y, x2: x2, y2: y, class: 'dl', 'marker-end': A }); }
      tx((x1 + x2) / 2 + (o.dx || 0), (o.below ? y + 13 : y - 4) + (o.dy || 0), l, o.c || 'dt', { 'text-anchor': o.anchor || 'middle' }); }
    function dimV(y1, y2, x, e1, e2, l, o) { o = o || {}; [[y1, e1], [y2, e2]].forEach(([y, e]) => { if (e == null) return; const s = Math.sign(x - e) || 1; mk('line', { x1: e + s * 3, y1: y, x2: x + s * 5, y2: y, class: 'ext' }); });
      if (y2 - y1 >= 28) mk('line', { x1: x, y1: y1, x2: x, y2: y2, class: 'dl', 'marker-start': A, 'marker-end': A }); else { mk('line', { x1: x, y1: y1 - 13, x2: x, y2: y1, class: 'dl', 'marker-end': A }); mk('line', { x1: x, y1: y2 + 13, x2: x, y2: y2, class: 'dl', 'marker-end': A }); }
      const c = (y1 + y2) / 2 + (o.dy || 0); if (o.side) { const r = o.side === 'r'; tx(r ? x + 6 : x - 6, c + 4, l, o.c || 'dt', { 'text-anchor': r ? 'start' : 'end' }); } else tx(x - 5, c, l, o.c || 'dt', { 'text-anchor': 'middle', transform: 'rotate(-90 ' + (x - 5) + ' ' + c + ')' }); }
    function callout(px, py, ex, ey, l, dir, c) { const s = dir || (ex >= px ? 1 : -1); mk('circle', { cx: px, cy: py, r: 1.8, class: 'dot' }); mk('polyline', { points: px + ',' + py + ' ' + ex + ',' + ey + ' ' + (ex + s * 10) + ',' + ey, class: 'lead' }); tx(ex + s * 14, ey + 4, l, c || 'dt', { 'text-anchor': s > 0 ? 'start' : 'end' }); }
    function rad(cx, cy, r, c, l, L) { const sx = c.indexOf('l') > -1 ? -1 : 1, sy = c.indexOf('t') > -1 ? -1 : 1; const ox = cx - sx * r, oy = cy - sy * r; callout(ox + sx * r * Math.SQRT1_2, oy + sy * r * Math.SQRT1_2, ox + sx * r * Math.SQRT1_2 + sx * L, oy + sy * r * Math.SQRT1_2 + sy * L, l, sx); }
    function nb(x, y, n) { mk('rect', { x: x - 6, y: y - 6, width: 12, height: 12, class: 'nb' }); tx(x, y + 3.5, String(n), 'nbt', { 'text-anchor': 'middle' }); }
    function rr(x, y, w, h, r, c, p) { return mk('rect', { x: x, y: y, width: w, height: h, rx: r, class: c }, p); }
    function slotLabel(x, y, w, h, l, al, p) { tx(al === 'l' ? x + 6 : x + w / 2, y + h / 2 + 3.2, l, 'sl', { 'text-anchor': al === 'l' ? 'start' : 'middle' }, p); }
    function title(x, y, t, s) { tx(x, y, t, 'vt', { 'text-anchor': 'middle' }); if (s) tx(x, y + 14, s, 'dts', { 'text-anchor': 'middle' }); }
    function xbox(x, y, w, h, p) { mk('rect', { x: x, y: y, width: w, height: h, class: 'thin' }, p); mk('path', { d: 'M' + x + ',' + y + ' l' + w + ',' + h + ' M' + (x + w) + ',' + y + ' l' + (-w) + ',' + h, class: 'thin' }, p); }
    function detailRef(cx, cy, r, lbl, lx, ly) { mk('circle', { cx: cx, cy: cy, r: r, class: 'ph' }); const a = Math.atan2(ly - cy, lx - cx); mk('line', { x1: cx + r * Math.cos(a), y1: cy + r * Math.sin(a), x2: lx, y2: ly, class: 'lead' }); tx(lx + (lx < cx ? -4 : 4), ly + 4, lbl, 'dts', { 'text-anchor': lx < cx ? 'end' : 'start' }); }
    function table(x, y, ttl, rows) { const ws = [40, 88, 96], rh = 17; tx(x, y - 8, ttl, 'vt'); [['Code', 'Variable', 'Value']].concat(rows).forEach((r, i) => { let c2 = x; r.forEach((c, j) => { mk('rect', { x: c2, y: y + i * rh, width: ws[j], height: rh, class: 'thin' }); tx(c2 + (j ? ws[j] / 2 : 6), y + i * rh + 12, c, i ? 'tc' : 'th', { 'text-anchor': j ? 'middle' : 'start' }); c2 += ws[j]; }); }); return y + (rows.length + 1) * rh + 34; }
    function notes(list) { tx(50, 58, 'Notes:', 'nth'); tx(112, 58, '(unless otherwise specified)', 'nt'); list.forEach(([n, t], i) => { const y = 88 + i * 24; if (n) { nb(56, y - 4, n); tx(72, y, t, 'nt'); } else tx(50, y, t, 'nt'); }); }

    /* Measured at 1440 px on /welcome: step item 259 wide. Row = 1096 = 1152 - 2*28. */
    const W = 259, H = 201, k = 2, PX = 470, PY = 300, X = v => PX + v * k, Y = v => PY + v * k;
    const r = (x, y, w, h, rx, c, l, al) => { rr(X(x), Y(y), w * k, h * k, rx * k, c); if (l) slotLabel(X(x), Y(y), w * k, h * k, l, al); };
    this.morph = []; this.iso = [1, 0, 0, 1, 0, 0]; this.flat = this.iso;

    at(-0.9, 0, 1.8); mk('line', { x1: X(0), y1: Y(0), x2: X(W), y2: Y(0), class: 'obj' });
    at(0.3, 0, .6); r(0, 0, W, H, 0, 'ph');
    at(0.6, .25, .6); r(0, 17, 60, 44, 2, 'slot', 'Numeral · hug', 'l'); r(0, 69, W, 24, 2, 'slot', 'Title slot · fill', 'l'); r(0, 101, W, 100, 2, 'slot', 'Body slot · hug · max 34ch', 'l');
    at(1.4, .1, .45); dimV(Y(0), Y(1), X(-30), X(0), X(0), 'B', { side: 'l', dy: -10 }); dimV(Y(1), Y(17), X(-30), X(0), X(0), 'S1', { side: 'l', dy: -4 }); dimV(Y(17), Y(61), X(-30), X(0), X(0), 'H1', { side: 'l' });
    at(2.0, .08, .45); dimV(Y(61), Y(69), X(-30), X(0), X(0), 'S2', { side: 'l', dy: -8 }); dimV(Y(69), Y(93), X(-30), X(0), X(0), 'H2', { side: 'l' }); dimV(Y(93), Y(101), X(-30), X(0), X(0), 'S2', { side: 'l', dy: 8 }); dimV(Y(101), Y(H), X(-30), X(0), X(0), 'HUG', { side: 'l', c: 'dts' });
    at(3.2, .1, .5); mk('line', { x1: X(-14), y1: Y(39), x2: X(W + 14), y2: Y(39), class: 'cl' }); dimH(X(0), X(W), Y(-30), Y(0), Y(0), 'W'); tx(X(W / 2) + 40, Y(-30) - 4, '= (ROW − 3·G) ÷ 4 · fill', 'dts');
    at(3.5, .1, .5); dimV(Y(0), Y(H), X(-76), X(0), X(0), 'H = B + S1 + H1 + 2·S2 + H2 + HUG', { c: 'dts' });
    at(3.9, .05, .4); nb(X(W) + 20, Y(0), 1); nb(X(W) + 20, Y(50), 2); nb(X(W) + 20, Y(150), 3); callout(X(150), Y(150), X(W) + 40, Y(185), 'MAX 34CH', 1, 'dts');
    at(4.2, .1, .5); title(X(W / 2), Y(H) + 50, 'Plan view', 'Scale 2:1 · step item · synthetic page');

    /* strip: four items, one grid row */
    { const s = .4, SX = 1075, SY = 330, sx = v => SX + v * s, sy = v => SY + v * s, G = 20, RW = 4 * W + 3 * G;
      at(5.6, .08, .5); for (let i = 0; i < 4; i++) { const x = i * (W + G); mk('line', { x1: sx(x), y1: sy(0), x2: sx(x + W), y2: sy(0), class: 'obj' }); rr(sx(x), sy(17), 60 * s, 44 * s, 1, 'slot'); rr(sx(x), sy(69), W * s, 24 * s, 1, 'slot'); rr(sx(x), sy(101), W * s, 100 * s, 1, 'slot'); }
      at(6.4, .06, .45); dimH(sx(0), sx(W), sy(-24), sy(0), sy(0), 'W'); dimH(sx(W), sx(W + G), sy(-24), sy(0), sy(0), 'G', { dx: 2 }); dimH(sx(0), sx(RW), sy(-56), sy(-24), sy(-24), 'ROW = 4·W + 3·G = 1096');
      dimV(sy(0), sy(H), sx(RW) + 24, sx(RW), sx(RW), 'H (REF)', { side: 'r' }); nb(sx(RW) + 8, sy(-24), 4);
      title(sx(RW / 2), sy(H) + 40, 'Row of four', 'Scale 0.4:1 · one grid row at 1440 px'); }

    /* the rest of the sheet */
    at(7.4, 0, 1.6); rr(20, 20, 1860, 1020, 16, 'border');
    at(8.2, .05, .4); notes([[1, 'Top rule only, 1 px. No card, no fill, no icon.'], [2, 'Numeral is decorative (aria-hidden). Title is the heading.'], [3, 'Body text is capped at 34ch. HUG height.'], [4, 'Row height is stretched to the tallest item. H is the hug height.'], [0, 'All dimensions CSS px at 1440. Slots are placeholders. Values are measured, not designed.']]);
    at(8.5, .006, .25); let yy = table(1620, 86, 'Spacing', [['B', 'rule-w', '1'], ['S1', 'pad-top', '16'], ['S2', 'stack-gap', '8'], ['G', 'col-gap', '20']]);
    yy = table(1620, yy, 'Size', [['H1', 'numeral-h', '36 / lh 44'], ['H2', 'title-h', '18 / lh 24'], ['HUG', 'body-h', 'REF 100'], ['H', 'item-h', 'REF 201'], ['W', 'item-w', '259']]);
    table(1620, yy, 'Type', [['T1', 'numeral', '36 · 700'], ['T2', 'title', '18 · 600'], ['T3', 'body', '14 / 20'], ['MW', 'body-max', '34ch']]);
  },
  render(t) {
    t = t / 0.85;
    let i = 0; while (i < DW_CAM.length - 2 && t > DW_CAM[i + 1].t) i++;
    const c0 = DW_CAM[i], c1 = DW_CAM[i + 1], p = eio(seg(t, c0.t, c1.t));
    const z = Math.exp(lerp(Math.log(c0.z), Math.log(c1.z), p)), cx = lerp(c0.cx, c1.cx, p), cy = lerp(c0.cy, c1.cy, p);
    this.cam.transform = 'translate(' + (960 - cx * z) + 'px,' + (540 - cy * z) + 'px) scale(' + z + ')';
    for (const it of this.reg) {
      let v = clamp01((t - it.a) / (it.b - it.a)); v = Math.round(v * 400) / 400;
      if (v === it.last) continue; it.last = v; const s = it.e.style;
      if (it.k === 'f') { s.opacity = eo(v); continue; }
      const e = eio(v); s.opacity = Math.min(1, v * 6);
      if (v >= 1) { s.strokeDasharray = ''; s.strokeDashoffset = ''; } else { s.strokeDasharray = '1 2'; s.strokeDashoffset = 1 - e; }
      s.fillOpacity = eo(seg(v, .55, 1));
    }
    const F = this.flat, I = this.iso;
    this.morph.forEach((m) => {
      const v = eio(seg(t, m.a, m.a + 1.5)), M = F.map((f, n) => lerp(f, I[n], v));
      M[5] -= m.z * v;
      m.g.style.opacity = eo(seg(t, m.a + 0.05, m.a + 0.5));
      const fo = eo(seg(t, m.a + 0.55, m.a + 1.25)); if (fo !== m.fo) { m.fo = fo; m.fills = m.fills || m.g.querySelectorAll('.obj,.well,.hug'); m.fills.forEach(e => { e.style.fillOpacity = fo; }); }
      m.g.setAttribute('transform', 'matrix(' + M.join(',') + ')');
      m.g.style.setProperty('--u', 1 / Math.sqrt(Math.abs(M[0] * M[3] - M[1] * M[2])));
    });
  },
});
</script>
<script>
(function () {
  const SC = SCENES.drawing, DUR = 11.5, frame = document.getElementById('frame');
  const play = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  SC.init(kit);
  const fit = () => { stage.style.transform = 'scale(' + frame.clientWidth / 1920 + ')'; };
  new ResizeObserver(fit).observe(frame); fit();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduced ? DUR : 0, playing = !reduced, last = null;
  const show = () => { SC.render(t, kit); scrub.value = t; time.textContent = t.toFixed(2) + ' / ' + DUR.toFixed(2) + ' s';
    play.textContent = playing ? 'Pause' : 'Play'; play.setAttribute('aria-label', playing ? 'Pause' : 'Play'); };
  const tick = now => { if (playing) { if (last !== null) t += (now - last) / 1000; if (t >= DUR) { t = DUR; playing = false; } }
    last = now; show(); requestAnimationFrame(tick); };
  play.onclick = () => { if (t >= DUR) t = 0; playing = !playing; last = null; show(); };
  scrub.oninput = () => { t = +scrub.value; playing = false; show(); };
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); play.click(); } });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
