pathway: breast_handover_demo
name: Breast cancer, surgery to oncology handover (demo)
version: 1
demo: true
proposed: true
signed_by: null
signed_at: null
steps:
  - id: surgery_done
    label: Surgery
    event_type: surgery_recorded
  - id: oncology_booked
    label: oncology booking
    event_type: appointment_booked
    max_gap_days_from: surgery_done
